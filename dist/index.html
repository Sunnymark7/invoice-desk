<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地识别、核对、汇总并合并 PDF 发票。">
  <title>票据台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151b2b'/%3E%3Cpath d='M19 13h26v38l-5-3-4 3-4-3-4 3-4-3-5 3V13Z' fill='%23f6f3eb'/%3E%3Cpath d='M25 23h14M25 31h14M25 39h8' stroke='%23e56f3e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css?v=20261031-teal">
</head>
<body>
  <header id="appHeader" class="topbar" hidden>
    <a class="brand" href="#" aria-label="票据台首页"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>票据台</span></a>
    <div class="topbar-actions"><button id="exportButton" class="secondary-button" type="button" disabled>导出明细 CSV</button><button id="mergeButton" class="primary-button" type="button" disabled>导出合并 PDF</button></div>
  </header>
  <main class="shell">
    <section id="reviewView" class="app-view active" aria-label="票据整理">
      <section id="uploadPanel" class="upload-panel landing-panel" aria-labelledby="landingTitle">
        <h1 id="landingTitle">整理发票</h1>
        <p class="landing-copy">将发票和相关凭证整理成一份报销材料</p>
        <button id="dropZone" class="drop-zone" type="button" aria-label="选择票据文件">选择票据文件</button>
        <p class="landing-drop-copy">或将 PDF 拖到这里</p>
        <p class="landing-file-types">PDF · OFD · JPG · PNG · WebP</p>
      </section>
      <input id="fileInput" type="file" accept="application/pdf,.pdf,.ofd,image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden>
      <aside id="batchTools" class="batch-tools" aria-label="票据工具" hidden>
        <button id="addMoreButton" class="side-tool add-more" type="button" aria-label="添加更多票据" title="添加更多票据"><img src="./vendor/icons/plus-lg.svg" alt=""><span id="sideFileCount" class="side-file-count">0</span></button>
        <div id="cardScaleControl" class="morph-scale-control"><button id="viewScaleButton" class="side-tool" type="button" aria-label="调整卡片大小" title="调整卡片大小" aria-expanded="false" aria-controls="viewScalePopover"><img src="./vendor/icons/arrows-angle-expand.svg" alt=""></button><div id="viewScalePopover" class="view-scale-popover morph-scale-popover" aria-label="卡片大小" hidden><button id="scaleMaxButton" class="scale-end-ball is-max" type="button" aria-label="最大卡片大小" title="160%"></button><button id="scaleMinButton" class="scale-end-ball is-min" type="button" aria-label="最小卡片大小" title="60%"></button><div class="morph-ruler" aria-hidden="true"><i class="morph-tick is-major" style="top:0%"></i><i class="morph-tick " style="top:5%"></i><i class="morph-tick " style="top:10%"></i><i class="morph-tick " style="top:15%"></i><i class="morph-tick is-major" style="top:20%"></i><i class="morph-tick " style="top:25%"></i><i class="morph-tick " style="top:30%"></i><i class="morph-tick " style="top:35%"></i><i class="morph-tick is-major" style="top:40%"></i><i class="morph-tick " style="top:45%"></i><i class="morph-tick " style="top:50%"></i><i class="morph-tick " style="top:55%"></i><i class="morph-tick is-major" style="top:60%"></i><i class="morph-tick " style="top:65%"></i><i class="morph-tick " style="top:70%"></i><i class="morph-tick " style="top:75%"></i><i class="morph-tick is-major" style="top:80%"></i><i class="morph-tick " style="top:85%"></i><i class="morph-tick " style="top:90%"></i><i class="morph-tick " style="top:95%"></i><i class="morph-tick is-major" style="top:100%"></i></div><input id="viewScaleRange" class="morph-range" type="range" min="60" max="160" step="5" value="100" aria-label="卡片缩放比例" aria-valuetext="100%"><button id="resetViewScaleButton" class="morph-reset" type="button" aria-label="恢复百分之百卡片大小" title="点击恢复 100%"><output id="viewScaleValue" for="viewScaleRange">100%</output></button></div></div>
      </aside>
      <p id="storageWarning" class="storage-warning" role="alert" hidden></p>
      <section id="resultsPanel" class="results-panel" aria-label="票据整理结果" hidden>
        <div class="summary-grid" aria-label="识别汇总">
          <article id="copyTotalButton" class="metric metric-total" role="button" tabindex="0" aria-label="复制合计金额" title="点击复制金额"><span>合计金额</span><strong><small>¥</small><b id="totalAmount">0.00</b></strong><em id="totalHint">等待添加票据</em><img class="copy-total-icon" src="./vendor/icons/copy.svg" alt="" aria-hidden="true"></article>
          <article class="metric"><span>计入合计</span><strong id="invoiceCount">0</strong><em>张票据</em></article>
          <article class="metric"><span>待核对</span><strong id="reviewCount">0</strong><em>条明细</em></article>
          <article class="metric"><span>附件</span><strong id="attachmentCount">0</strong><em>不计入金额</em></article>
        </div>
        <div class="progress-wrap" id="progressWrap" hidden><div class="progress-copy"><span id="progressText">正在识别…</span><span id="progressValue">0%</span></div><div id="recognitionProgress" class="progress-track" role="progressbar" aria-labelledby="progressText" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressBar"></i></div></div>
        <div class="workspace-toolbar">
          <div class="review-filters" role="group" aria-label="按识别状态筛选"><button class="review-filter active" data-filter="all" type="button" aria-pressed="true">全部 <span data-filter-count="all">0</span></button><button class="review-filter" data-filter="review" type="button" aria-pressed="false">待核对 <span data-filter-count="review">0</span></button><button class="review-filter" data-filter="confirmed" type="button" aria-pressed="false">已核对 <span data-filter-count="confirmed">0</span></button><button class="review-filter" data-filter="attachment" type="button" aria-pressed="false">附件 <span data-filter-count="attachment">0</span></button></div>
          <label class="order-select"><span>排序方式</span><select id="sortModeSelect" aria-label="票据排序方式"><option value="import">导入顺序</option><option value="date">开票时间：从早到晚</option><option value="date-desc">开票时间：从晚到早</option><option value="company">公司名称：A → Z</option><option value="company-desc">公司名称：Z → A</option><option value="paired">凭证自动配对</option><option value="manual" disabled>手动调整</option></select></label>
          <span class="toolbar-spacer"></span>
          <div id="searchControl" class="search-control"><button id="searchToggleButton" class="icon-toggle" type="button" aria-label="搜索票据" title="搜索票据" aria-expanded="false" aria-controls="searchPopover"><img src="./vendor/icons/search.svg" alt=""></button><div id="searchPopover" class="search-popover" hidden><input id="reviewSearch" type="search" aria-label="搜索票据内容" placeholder="销售方、票号、日期或文件名"><button id="clearSearchButton" class="icon-toggle" type="button" aria-label="清除搜索"><img src="./vendor/icons/x-lg.svg" alt=""></button></div></div>
          <div class="layout-toggle" role="group" aria-label="展示方式"><button type="button" data-layout="list" aria-pressed="false" aria-label="列表视图" title="列表视图"><img src="./vendor/icons/list-ul.svg" alt=""></button><button type="button" data-layout="grid" class="active" aria-pressed="true" aria-label="网格视图" title="网格视图"><img src="./vendor/icons/grid.svg" alt=""></button></div>
        </div>
        <div class="selection-strip"><p id="reviewResultHint" class="review-result-hint" role="status"></p><div class="selection-actions"><span id="selectionSummary" class="selection-summary" role="status" hidden></span><button id="selectAllButton" class="selection-action" type="button" aria-pressed="false" hidden>全选</button><button id="deleteSelectedButton" class="selection-action danger" type="button" hidden>批量删除</button></div></div>
        <div id="pageDeleteNotice" class="page-delete-notice" hidden><span id="pageDeleteMessage" role="status"></span><button id="undoPageDeleteButton" class="secondary-button" type="button">撤销删除</button></div>
        <div id="invoiceCollection" class="invoice-collection" data-layout="list"><div id="invoiceBody" class="invoice-items" role="list" aria-label="票据列表"></div></div>
      </section>
    </section>
  </main>
  <dialog id="editDialog" class="edit-dialog" aria-labelledby="editDialogTitle">
    <form method="dialog" id="editForm" class="edit-shell">
      <section class="edit-preview-pane">
        <header><div><strong id="editPreviewTitle">原始票面</strong><select id="editPageSelect" aria-label="切换当前发票页面" hidden></select></div><div class="edit-zoom-controls"><button id="editZoomOut" type="button" aria-label="缩小票面">−</button><button id="editZoomReset" type="button">100%</button><button id="editZoomIn" type="button" aria-label="放大票面">＋</button><button id="editRotateButton" type="button" aria-label="逆时针旋转90度">逆时针 90°</button></div></header>
        <div id="editPreviewStage" class="edit-preview-stage"><canvas id="editPreviewCanvas" aria-label="当前票据真实内容"></canvas><div id="editPreviewLoading" class="preview-loading">正在生成票面…</div></div>
        <footer>拖动查看细节 · 滚轮缩放</footer>
      </section>
      <section class="edit-form-pane">
        <div class="dialog-head"><div><h3 id="editDialogTitle">核对并修改</h3><p id="editStatusHint" class="edit-status-hint" role="status">对照票面修改信息，保存后更新合计。</p></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
        <input id="editId" type="hidden">
        <div class="form-grid">
          <label>开票日期<input id="editDate" type="date"></label>
          <label>票据类别<select id="editCategory"><option>交通</option><option>住宿</option><option>机票</option><option>保险</option><option>研发耗材</option><option>技术服务</option><option>办公设备</option><option>其他</option><option>附件</option></select></label>
          <label class="wide">销售方<input id="editSeller" type="text" placeholder="销售方名称"></label>
          <label class="wide">发票号码<input id="editNumber" type="text" placeholder="发票号码或凭证号"></label>
          <label>金额（元）<input id="editAmount" type="number" step="0.01" placeholder="0.00"></label>
          <label>计入合计<select id="editIncluded"><option value="true">计入</option><option value="false">仅作附件</option></select></label>
        </div>
        <div class="dialog-actions"><button value="cancel" class="text-button">取消</button><button id="saveEdit" value="default" class="primary-button">保存修改</button></div>
      </section>
    </form>
  </dialog>

  <dialog id="previewDialog" class="preview-dialog" aria-labelledby="previewTitle">
    <div class="preview-shell">
      <header class="preview-head">
        <div>
          <h3 id="previewTitle">票据预览</h3>
          <span id="previewMeta">第 1 页</span>
        </div>
        <div class="preview-controls" aria-label="预览控制">
          <button id="zoomOutButton" class="preview-tool" type="button" aria-label="缩小">−</button>
          <button id="zoomResetButton" class="preview-zoom" type="button">100%</button>
          <button id="zoomInButton" class="preview-tool" type="button" aria-label="放大">＋</button>
          <button id="rotatePreviewButton" class="preview-tool rotate-tool" type="button" aria-label="逆时针旋转90度">逆时针 90°</button>
          <button id="closePreviewButton" class="preview-close" type="button" aria-label="关闭预览">×</button>
        </div>
      </header>
      <div class="preview-body">
        <section class="preview-viewer" aria-label="票面预览">
          <button id="previewPrevButton" class="preview-nav preview-prev" type="button" aria-label="上一张票据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg><span>上一张</span></button>
          <div id="previewStage" class="preview-stage">
            <canvas id="previewCanvas" aria-label="PDF 票据页面"></canvas>
            <div id="previewLoading" class="preview-loading">正在生成预览…</div>
          </div>
          <button id="previewNextButton" class="preview-nav preview-next" type="button" aria-label="下一张票据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg><span>下一张</span></button>
        </section>
        <aside class="preview-details" aria-labelledby="previewDetailsTitle">
          <div class="preview-details-head"><h3 id="previewDetailsTitle">票据核对</h3><span id="previewPosition"></span></div>
          <div class="preview-review-scroll">
          <div id="previewDetails" aria-live="polite" aria-atomic="true"></div>
          <p id="previewPageHint" class="preview-page-hint"></p>
          <form id="previewForm" class="preview-form" novalidate>
            <p id="previewStatusHint" class="preview-status-hint" role="status"></p>
            <div class="preview-form-fields">
              <label>金额（元）<input id="previewAmount" type="number" step="0.01" inputmode="decimal" placeholder="未识别" aria-describedby="previewStatusHint"></label>
              <label>计入合计<select id="previewIncluded"><option value="true">计入</option><option value="false">仅作附件</option></select></label>
              <label>开票日期<input id="previewDate" type="date" aria-describedby="previewStatusHint"></label>
              <label>票据类别<select id="previewCategory"><option>交通</option><option>住宿</option><option>机票</option><option>保险</option><option>研发耗材</option><option>技术服务</option><option>办公设备</option><option>其他</option><option>附件</option></select></label>
              <label class="wide">销售方<input id="previewSeller" type="text" placeholder="未识别" aria-describedby="previewStatusHint"></label>
              <label class="wide">发票 / 凭证号码<input id="previewNumber" type="text" placeholder="未识别" aria-describedby="previewStatusHint"></label>
            </div>
            <div class="preview-save-actions"><p id="previewSaveHint" role="status"></p><button id="previewEditButton" class="secondary-button" type="submit">保存核对</button><button id="previewSaveNext" class="primary-button" type="button">保存并下一张</button><button id="previewResetButton" class="preview-reset" type="button">重置修改</button></div>
          </form>
          </div>
        </aside>
      </div>
      <footer class="preview-help">两侧翻页 · 拖动查看 · 双指或按钮缩放 · 旋转仅影响预览</footer>
    </div>
  </dialog>

  <div id="dragInsertMarker" class="drag-insert-marker" hidden></div>
  <div id="selectionRect" class="selection-rect" hidden></div>
  <div id="dragSelectionBadge" class="drag-selection-badge" hidden></div>
  <div id="windowDropHint" class="window-drop-hint" hidden><strong>松开以添加票据</strong><span>PDF、OFD 和图片可直接拖进窗口</span></div>
  <div id="undoEmptyDeleteToast" class="undo-empty-toast" role="status" hidden><span>已删除全部票据</span><button id="undoEmptyDeleteButton" type="button">撤销删除</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/pdf-lib.min.js"></script>
  <script src="./vendor/tesseract.min.js"></script>
  <script type="module" src="./desktop.js"></script>
  <script type="module" src="./app.js?v=20261031-teal"></script>
</body>
</html>
